name: Finalize Business landing legal consistency
on:
  push:
    branches: [main]
    paths:
      - '.github/business-landing-legal-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Business landing
        run: python scripts/finalize_business_landing_legal.py
      - name: Validate
        run: |
          grep -q 'AUSSCHLIESSLICH FÜR UNTERNEHMER' business/index.html
          grep -q 'keine automatische Umwandlung' business/index.html
          grep -q 'app.html#agb' business/index.html
          grep -q 'app.html#avv' business/index.html
          grep -q 'app.html#datenschutz' business/index.html
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/business-landing-legal-trigger.txt .github/workflows/finalize-business-landing-legal.yml scripts/finalize_business_landing_legal.py
          git add business/index.html
          git commit -m 'Align Business landing with B2B legal terms'
          git push origin main
