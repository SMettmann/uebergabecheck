name: Fix contact email

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contact email
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('E-Mail: [E-Mail-Adresse]', 'E-Mail: info@uebergabe-check.de')
          s = s.replace('E-Mail: <strong>[DEINE E-MAIL-ADRESSE EINTRAGEN]</strong>', 'E-Mail: <strong>info@uebergabe-check.de</strong>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-contact-email.yml
          git commit -m "Add contact email to legal pages"
          git push