name: Business pricing
on:
  push:
    branches: [feature/business-pricing]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/business-pricing
      - name: Add pricing section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('business/index.html')
          s=p.read_text()
          old_css='.section{margin-top:26px;background:#111;color:#fff;border-radius:24px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:24px}'
          pricing_css='.pricing{margin-top:28px;background:#fff;border:1px solid #e2e3e6;border-radius:24px;padding:34px;display:grid;grid-template-columns:.9fr 1.1fr;gap:34px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.035)}.pricing-kicker{font-size:12px;font-weight:850;letter-spacing:1.4px;color:#777;text-transform:uppercase;margin-bottom:10px}.pricing h2{font-size:31px;letter-spacing:-.8px;margin:0 0 10px}.pricing-copy{margin:0;color:#666;line-height:1.6}.price{font-size:46px;font-weight:900;letter-spacing:-1.8px;margin:20px 0 2px}.price small{font-size:15px;font-weight:700;letter-spacing:0;color:#777}.trial{font-size:14px;font-weight:800;margin-bottom:20px}.pricing-list{display:grid;grid-template-columns:1fr 1fr;gap:11px 18px;margin:0;padding:0;list-style:none}.pricing-list li{font-size:13px;line-height:1.45;color:#444}.pricing-list li::before{content:\"✓\";font-weight:900;margin-right:8px;color:#111}.pricing-actions{margin-top:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.pricing-note{font-size:12px;color:#777;line-height:1.5}.section{margin-top:26px;background:#111;color:#fff;border-radius:24px;padding:30px;display:flex;align-items:center;justify-content:space-between;gap:24px}'
          if old_css not in s:
              raise SystemExit('CSS anchor not found')
          s=s.replace(old_css,pricing_css,1)
          s=s.replace('@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}', '@media(max-width:800px){.pricing{grid-template-columns:1fr}.pricing-list{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}',1)
          s=s.replace('@media(max-width:560px){.top{align-items:flex-start}', '@media(max-width:560px){.pricing{padding:24px 18px}.pricing-list{grid-template-columns:1fr}.price{font-size:40px}.pricing-actions .btn{width:100%}.top{align-items:flex-start}',1)
          anchor='  </main>\n\n  <section class="section">'
          pricing='''  </main>\n\n  <section class="pricing" id="preis">\n    <div>\n      <div class="pricing-kicker">Ein Tarif. Alles drin.</div>\n      <h2>ÜbergabeCheck Business</h2>\n      <p class="pricing-copy">Für Hausverwaltungen, Vermieter und Unternehmen, die Wohnungsübergaben dauerhaft digital organisieren möchten.</p>\n      <div class="price">29,99 € <small>/ Monat</small></div>\n      <div class="trial">14 Tage kostenlos testen</div>\n      <div class="pricing-actions">\n        <a class="btn primary" href="app.html">14 Tage kostenlos testen →</a>\n        <div class="pricing-note">Danach 29,99 € monatlich<br>jederzeit kündbar</div>\n      </div>\n    </div>\n    <ul class="pricing-list">\n      <li>Unbegrenzte Objekte &amp; Wohnungen</li>\n      <li>Digitale Übergabeprotokolle</li>\n      <li>Fotos &amp; Mängeldokumentation</li>\n      <li>Digitale Unterschriften</li>\n      <li>PDF-Export &amp; E-Mail-Versand</li>\n      <li>Eigener Firmenbriefkopf</li>\n      <li>Gespeicherte vergangene Übergaben</li>\n    </ul>\n  </section>\n\n  <section class="section">'''
          if anchor not in s:
              raise SystemExit('HTML anchor not found')
          s=s.replace(anchor,pricing,1)
          p.write_text(s)
          PY
      - name: Validate pricing
        run: |
          grep -q '29,99 €' business/index.html
          grep -q '14 Tage kostenlos testen' business/index.html
          grep -q 'Eigener Firmenbriefkopf' business/index.html
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/business-pricing.yml
          git add business/index.html
          git commit -m 'Show Business pricing and included features'
          git push origin feature/business-pricing
